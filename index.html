<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV Global Hub | 글로벌 순수전기차(BEV) 판매량·가격·성능 비교 대시보드</title>
  <meta name="description" content="한국(현대·기아), 독일 3사+, 미국(테슬라·GM·포드), 중국(BYD·샤오미·지리), 일본(토요타·혼다·닛산) 순수전기차(BEV)의 4개국 가격, 핵심 성능, 2024~2026 연도/분기별 판매량 순위를 비교하세요." />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Pretendard & JetBrains Mono Fonts -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen selection:bg-sky-500 selection:text-white antialiased transition-colors duration-200">

  <!-- Background Ambient Glow -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-sky-500/10 dark:bg-sky-500/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-40 w-[30rem] h-[30rem] bg-indigo-500/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Top Sticky Header -->
  <header class="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800/80 bg-white/85 dark:bg-slate-950/85 backdrop-blur-xl transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20 font-bold text-lg text-white shrink-0">
          ⚡
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg sm:text-xl font-bold tracking-tight bg-gradient-to-r from-slate-900 via-slate-800 to-sky-600 dark:from-white dark:via-slate-100 dark:to-sky-400 bg-clip-text text-transparent">
              EV Global Hub
            </h1>
            <span class="hidden md:inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-500/30">
              100% Pure BEV · Verified Data
            </span>
          </div>
          <p id="headerSubtitle" class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">
            전 세계 베스트셀링 & 최신 순수전기차(BEV) 4개국 가격 · 성능 · 분기별 판매량 비교
          </p>
        </div>
      </div>

      <!-- Right Controls: Period Selector, Currency, Language, Theme Mode -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Period Selector -->
        <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-900/90 border border-slate-300 dark:border-slate-800 rounded-lg px-2 sm:px-2.5 py-1.5">
          <span id="periodLabelText" class="text-xs text-slate-500 dark:text-slate-400 hidden lg:inline">📅 기준 기간:</span>
          <select id="globalPeriodSelect" class="bg-transparent text-xs sm:text-sm font-semibold text-sky-600 dark:text-sky-400 focus:outline-none cursor-pointer">
            <!-- Populated dynamically -->
          </select>
        </div>

        <!-- Currency Toggle Button -->
        <button id="currencyToggleBtn" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition flex items-center gap-1" title="Currency Display Mode">
          <span>💱</span>
          <span id="currencyToggleLabel" class="hidden sm:inline">현지 통화</span>
        </button>

        <!-- Language Toggle (KO / EN) -->
        <button id="langToggleBtn" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-200 transition flex items-center gap-1" title="한국어 / English 전환">
          <span>🌐</span>
          <span id="langToggleLabel">English</span>
        </button>

        <!-- Normal Mode / Night Mode Toggle -->
        <button id="themeToggleBtn" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-200 transition flex items-center gap-1" title="Normal Mode / Night Mode 전환">
          <span id="themeToggleIcon">🌙</span>
          <span id="themeToggleLabel" class="hidden md:inline">Night Mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-5 pb-28">

    <!-- KPI Summary Cards (Rendered dynamically via JS) -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4" id="kpiSection"></section>

    <!-- Structured 3-Tier Filter & Search Control Panel -->
    <section class="glass-card p-4 sm:p-5 rounded-2xl border border-slate-200 dark:border-slate-800/90 space-y-3.5">
      
      <!-- Tier 1: Country / Region Tabs (Single Line, Clean Labels) + Search + Sort -->
      <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-3">
        <!-- Region Filter Pills (Dynamically rendered from REGIONS) -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 xl:pb-0" id="regionFilterGroup"></div>

        <!-- Search & Sort Controls -->
        <div class="flex flex-wrap sm:flex-nowrap items-center gap-2 shrink-0">
          <div class="relative flex-1 sm:w-60">
            <input
              type="text"
              id="searchInput"
              placeholder="모델명, 브랜드, 키워드 검색..."
              class="w-full bg-white dark:bg-slate-900/90 border border-slate-300 dark:border-slate-700/80 rounded-xl pl-8 pr-3 py-1.5 text-xs sm:text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-sky-500"
            />
            <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs">🔍</span>
          </div>

          <select id="sortSelect" class="bg-white dark:bg-slate-900/90 border border-slate-300 dark:border-slate-700/80 rounded-xl px-3 py-1.5 text-xs sm:text-sm font-medium text-slate-800 dark:text-slate-200 focus:outline-none focus:border-sky-500 cursor-pointer"></select>
        </div>
      </div>

      <!-- Tier 2: Manufacturer Brand Selector (Dedicated Row - No Overlap or Clipping) -->
      <div class="pt-3 border-t border-slate-200/80 dark:border-slate-800/80 flex items-start sm:items-center gap-2.5">
        <span id="brandRowLabel" class="text-[11px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider shrink-0 pt-1 sm:pt-0">
          브랜드
        </span>
        <div class="flex flex-wrap items-center gap-1.5 flex-1" id="brandFilterGroup">
          <!-- Populated dynamically via JS without duplicate country flags -->
        </div>
      </div>

      <!-- Tier 3: Segment & Quick Specification Toggles + Result Counter -->
      <div class="pt-3 border-t border-slate-200/80 dark:border-slate-800/80 flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2">
          <span id="specRowLabel" class="text-[11px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mr-0.5">
            세부 조건
          </span>
          <select id="segmentFilter" class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1 text-xs font-medium text-slate-700 dark:text-slate-300 focus:outline-none cursor-pointer"></select>

          <button id="filter800V" class="px-2.5 py-1 rounded-lg text-xs font-medium border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
            ⚡ 800V+ 초급속
          </button>
          <button id="filterNewOnly" class="px-2.5 py-1 rounded-lg text-xs font-medium border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
            🆕 신차·최신형
          </button>
          <button id="filterBestOnly" class="px-2.5 py-1 rounded-lg text-xs font-medium border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
            🔥 베스트셀러
          </button>
          <button id="resetFiltersBtn" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 transition">
            ↺ 필터 초기화
          </button>
        </div>

        <div class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-2 ml-auto">
          <span id="resultCountWrapper"></span>
        </div>
      </div>
    </section>

    <!-- View Mode Navigation Tabs -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-800 pb-3">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar" id="viewTabs">
        <button data-view="cards" class="view-tab active px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition shrink-0">
          <span>🗂️</span> <span id="tabCardsLabel">차량 카드 & 4개국 가격 비교</span>
        </button>
        <button data-view="table" class="view-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition shrink-0">
          <span>📋</span> <span id="tabTableLabel">전체 스펙·가격·판매량 일람표</span>
        </button>
        <button data-view="charts" class="view-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition shrink-0">
          <span>📈</span> <span id="tabChartsLabel">분기별 판매 추이 & 포지셔닝 차트</span>
        </button>
      </div>

      <div class="text-xs text-slate-500 dark:text-slate-400 hidden md:block" id="compareHintText"></div>
    </div>

    <!-- VIEW 1: Vehicle Cards Grid -->
    <section id="view-cards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"></section>

    <!-- VIEW 2: Comprehensive Table View -->
    <section id="view-table" class="hidden">
      <div class="glass-card rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs sm:text-sm">
            <thead>
              <tr id="tableHeadRow" class="bg-slate-100 dark:bg-slate-900/95 border-b border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 font-semibold whitespace-nowrap"></tr>
            </thead>
            <tbody id="evTableBody" class="divide-y divide-slate-200 dark:divide-slate-800/70 font-mono text-xs"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- VIEW 3: Analytics & Quarterly Sales Charts -->
    <section id="view-charts" class="hidden space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="glass-card p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
          <div class="mb-4">
            <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
              <span>🏆</span> <span id="chartSalesTitle"></span>
            </h3>
            <p id="chartSalesSub" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5"></p>
          </div>
          <div class="h-80"><canvas id="topModelsBarChart"></canvas></div>
        </div>

        <div class="glass-card p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
          <div class="mb-4">
            <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
              <span>📈</span> <span id="chartBrandTitle"></span>
            </h3>
            <p id="chartBrandSub" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5"></p>
          </div>
          <div class="h-80"><canvas id="brandTrendLineChart"></canvas></div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="glass-card p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
          <div class="mb-4">
            <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
              <span>🌍</span> <span id="chartPriceTitle"></span>
            </h3>
            <p id="chartPriceSub" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5"></p>
          </div>
          <div class="h-80"><canvas id="regionalPriceBarChart"></canvas></div>
        </div>

        <div class="glass-card p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
          <div class="mb-4">
            <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
              <span>🎯</span> <span id="chartScatterTitle"></span>
            </h3>
            <p id="chartScatterSub" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5"></p>
          </div>
          <div class="h-80"><canvas id="priceRangeScatterChart"></canvas></div>
        </div>
      </div>
    </section>

    <!-- Data Verification & Sources Footnote -->
    <section id="footnoteSection" class="glass-card p-5 rounded-2xl border border-slate-200 dark:border-slate-800/80 text-xs text-slate-600 dark:text-slate-400 space-y-2"></section>

  </main>

  <!-- Floating Comparison Tray (Bottom Dock) -->
  <div id="compareDock" class="fixed bottom-0 inset-x-0 z-40 transform translate-y-full transition-transform duration-300">
    <div class="max-w-5xl mx-auto px-4 pb-4">
      <div class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-sky-500/40 rounded-2xl p-3 sm:p-4 shadow-2xl shadow-sky-950/30 dark:shadow-sky-950/60 flex flex-col sm:flex-row items-center justify-between gap-3">
        <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto overflow-x-auto no-scrollbar" id="compareSlotList"></div>
        <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end">
          <button id="clearCompareBtn" class="px-3 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition"></button>
          <button id="openCompareModalBtn" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white shadow-lg shadow-sky-500/25 transition">
            <span id="openCompareBtnText"></span> (<span id="compareCountBadge">0</span>/4)
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Head-to-Head Comparison Modal -->
  <div id="compareModal" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-6 bg-slate-950/70 backdrop-blur-md">
    <div class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-3xl max-w-6xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div>
          <h2 id="modalTitle" class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2"></h2>
          <p id="modalSub" class="text-xs text-slate-500 dark:text-slate-400"></p>
        </div>
        <button id="closeCompareModalBtn" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center text-lg font-bold transition">
          ✕
        </button>
      </div>
      <div class="p-4 sm:p-6 overflow-y-auto space-y-6" id="compareModalBody"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
