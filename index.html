        <p>본 페이지에서는 테슬라 모델 Y 주니퍼, 모델 3 하이랜드, 사이버트럭, 현대 아이오닉 9, 더 뉴 아이오닉 5, 캐스퍼 일렉트릭(인스터), 기아 EV3, EV4, EV6, EV9, BMW 노이어 클라쎄 iX3, i4, iX1, 메르세데스-벤츠 전기 CLA, GLC EQ, GLE EQ, 아우디 Q6 e-트론, Q4 e-트론, 포르쉐 마칸 일렉트릭, 폭스바겐 ID.4, BYD 시걸, 아토 3, 씰, 샤오미 SU7, YU7, 지리 싱위안, 지커 7X, 토요타 bZ4X, 혼다 프롤로그, 닛산 아리야의 한국·미국·중국·유럽 가격과 성능 및 분기별 판매량을 비교할 수 있습니다.</p>
      </section>
    </noscript>

  </main>

  <!-- Floating Comparison Tray (Bottom Dock) -->
  <div id="compareDock" class="fixed bottom-0 inset-x-0 z-40 transform translate-y-full transition-transform duration-300">
    <div class="max-w-5xl mx-auto px-4 pb-4">
      <div class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-sky-500/40 rounded-2xl p-3 sm:p-4 shadow-2xl shadow-sky-950/30 dark:shadow-sky-950/60 flex flex-col sm:flex-row items-center justify-between gap-3">
        <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto overflow-x-auto no-scrollbar" id="compareSlotList"></div>
        <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end">
          <button id="clearCompareBtn" type="button" class="px-3 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition"></button>
          <button id="openCompareModalBtn" type="button" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white shadow-lg shadow-sky-500/25 transition">
            <span id="openCompareBtnText"></span> (<span id="compareCountBadge">0</span>/4)
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Head-to-Head Comparison Modal -->
  <div id="compareModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-6 bg-slate-950/70 backdrop-blur-md">
    <div class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-3xl max-w-6xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div>
          <h2 id="modalTitle" class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2"></h2>
          <p id="modalSub" class="text-xs text-slate-500 dark:text-slate-400"></p>
        </div>
        <button id="closeCompareModalBtn" type="button" aria-label="비교 창 닫기" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center text-lg font-bold transition">
          ✕
        </button>
      </div>
      <div class="p-4 sm:p-6 overflow-y-auto space-y-6" id="compareModalBody"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
